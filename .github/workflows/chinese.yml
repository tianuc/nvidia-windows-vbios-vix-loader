name: 构建中文版
on:
  push:
    branches: ['codex/zh-cn']
    tags: ['v*-zh.*']
  pull_request:
    branches: ['codex/zh-cn']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: 校验发布标签
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = Get-Content upstream-version.json | ConvertFrom-Json
          $expected = "$($v.tag)-zh.$($v.chinese_revision)"
          if ($env:GITHUB_REF_NAME -ne $expected) { throw "Tag must be $expected" }
      - name: 原版测试与中文确认检查
        run: python -m unittest discover -s tests -v
      - name: 安装打包工具
        run: python -m pip install pyinstaller==6.22.3
      - name: 构建可独立运行的中文版
        run: python tools/build_chinese.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vbios-loader-chinese-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS-ZH
          if-no-files-found: error
  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: vbios-loader-chinese-windows-x64
          path: dist
      - name: 发布中文版
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*.exe dist/*.zip dist/SHA256SUMS-ZH
          --title "$RELEASE_TAG 简体中文版"
          --notes "与对应上游版本对齐的中文社区版。使用方法见 README_CN.md；EXE、许可证完整包及 SHA256 校验文件见附件。"
